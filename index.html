<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="WalletZen — suas finanças, em paz." />
    <title>WalletZen</title>
    <script>
      // Aplica o tema salvo antes do React carregar, para o reload não piscar no claro.
      // A chave é a mesma do ThemeProvider.
      try {
        if (localStorage.getItem("walletzen:theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch {
        // storage indisponível: fica no claro
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
